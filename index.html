<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="The classic DVD screensaver. Just a logo, bouncing forever.">
<title>Are you lost?</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}main{position:fixed;inset:0;overflow:hidden}#dvd{position:absolute;left:0;top:0;width:clamp(110px,17vw,220px);height:auto;color:#55f5ff;will-change:transform;user-select:none}button{position:fixed;left:16px;bottom:16px;opacity:0;background:#111;color:#fff;border:1px solid #777;padding:10px 15px;border-radius:6px}button:focus-visible{opacity:1}
</style>
</head>
<body>
<main aria-label="A DVD logo bouncing around a black screen">
<svg id="dvd" viewBox="0 0 240 120" role="img" aria-label="DVD video" xmlns="http://www.w3.org/2000/svg">
<g fill="currentColor">
<g transform="translate(9 4) skewX(-12)">
<path fill-rule="evenodd" d="M12 9h34c28 0 38 13 34 31C76 59 61 68 35 68H0L12 9zm18 14-6 31h14c13 0 21-5 24-15 2-10-3-16-15-16H30z"/>
<path d="M77 9h22l10 37 26-37h23l-48 61h-15z"/>
<path fill-rule="evenodd" d="M160 9h34c28 0 38 13 34 31-4 19-19 28-45 28h-35l12-59zm18 14-6 31h14c13 0 21-5 24-15 2-10-3-16-15-16h-17z"/>
</g>
<path fill-rule="evenodd" d="M120 78c62 0 112 6 112 14s-50 14-112 14S8 100 8 92s50-14 112-14zm0 9c-17 0-31 2-31 5s14 5 31 5 31-2 31-5-14-5-31-5z"/>
<text x="120" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="11">VIDEO</text>
</g>
</svg>
</main>
<button id="pause" aria-pressed="false">Pause animation</button>
<script>
const logo=document.querySelector('#dvd'), button=document.querySelector('#pause');
const colors=['#55f5ff','#ff57cf','#baff43','#ffab40','#9b7bff','#fff05b','#52ffad'];
let x=0,y=0,vx=0,vy=0,maxX=0,maxY=0,last=0,color=0;
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function direction(sx,sy){const angle=(25+Math.random()*40)*Math.PI/180,speed=115;vx=sx*Math.cos(angle)*speed;vy=sy*Math.sin(angle)*speed}
function bounds(){maxX=Math.max(0,innerWidth-logo.getBoundingClientRect().width);maxY=Math.max(0,innerHeight-logo.getBoundingClientRect().height);x=Math.min(x,maxX);y=Math.min(y,maxY);paint()}
function paint(){logo.style.transform=`translate3d(${x}px,${y}px,0)`}
function tint(){color=(color+1+Math.floor(Math.random()*(colors.length-1)))%colors.length;logo.style.color=colors[color]}
function toggle(){paused=!paused;sync()}
function sync(){button.textContent=paused?'Play animation':'Pause animation';button.setAttribute('aria-pressed',String(paused))}
bounds();x=Math.random()*maxX;y=Math.random()*maxY;direction(Math.random()<.5?-1:1,Math.random()<.5?-1:1);paint();sync();
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!paused){x+=vx*dt;y+=vy*dt;const hitX=x<=0||x>=maxX,hitY=y<=0||y>=maxY;if(hitX||hitY){let sx=Math.sign(vx),sy=Math.sign(vy);if(hitX)sx=x<=0?1:-1;if(hitY)sy=y<=0?1:-1;x=Math.max(0,Math.min(x,maxX));y=Math.max(0,Math.min(y,maxY));direction(sx,sy);tint()}paint()}requestAnimationFrame(frame)}
addEventListener('resize',bounds);button.addEventListener('click',toggle);addEventListener('keydown',e=>{if(e.code==='Space'&&e.target!==button){e.preventDefault();toggle()}});requestAnimationFrame(frame);
</script>
</body>
</html>
